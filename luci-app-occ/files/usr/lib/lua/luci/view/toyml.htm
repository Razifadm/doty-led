
<%+header%>
<h2><%:OC Converter%></h2>
<p><%:Convert VLESS / VMess / Trojan Converter.%></p>
<style>
.custom-alert {
    padding: 12px 18px;
    border-radius: 5px;
    margin: 15px 0;
    font-weight: 500;
    font-size: 14px;
    border: 1px solid transparent;
}
.custom-alert-success {
    background-color: #e8f7e4;
    border-color: #a6d8a0;
    color: #2f6627;
}
.custom-alert-danger {
    background-color: #fde8e8;
    border-color: #f5b5b5;
    color: #7d1d1d;
}
</style>

<div class="cbi-section">
<div id="status" class="custom-alert" style="display:none;"></div>

  <div class="cbi-value">
    <label class="cbi-value-title"><%:Save As Name%>:</label>
    <div class="cbi-value-field">
      <input type="text" id="filename" class="cbi-input-text" placeholder="custom">
    </div>
  </div>

  <div class="cbi-value">
    <label class="cbi-value-title"><%:Paste Config%>:</label>
    <div class="cbi-value-field">
      <textarea id="config" class="cbi-input-textarea" rows="6"></textarea>
    </div>
  </div>

  <div class="cbi-value">
    <label class="cbi-value-title"><%:Generated YAML%>:</label>
    <div class="cbi-value-field">
      <textarea id="yaml" class="cbi-input-textarea" rows="12"></textarea>
    </div>
  </div>

  <div class="cbi-value">
    <div class="cbi-value-field">
      <button class="btn cbi-button cbi-button-save" onclick="saveYAML()"><%:Save%></button>
    </div>
  </div>

</div>

<script>
let timer = null;
let alertTimer = null;

document.getElementById('config').addEventListener('input', function() {
    clearTimeout(timer);
    timer = setTimeout(convertConfig, 500);
});

function convertConfig() {
    let config = document.getElementById('config').value;
    if (config.trim() === "") {
        document.getElementById('yaml').value = "";
        return;
    }
    fetch('<%=url("admin/tools/toyml_convert")%>', {
        method: 'POST',
        body: new URLSearchParams({ config })
    })
    .then(res => res.text())
    .then(data => {
        document.getElementById('yaml').value = data;
    });
}

function showAlert(message, type) {
    let statusEl = document.getElementById('status');
    clearTimeout(alertTimer);
    statusEl.className = "custom-alert custom-alert-" + type;
    statusEl.innerHTML = message;
    statusEl.style.display = "block";
    alertTimer = setTimeout(() => {
        statusEl.style.display = "none";
    }, 20000);
}

function saveYAML() {
    let filename = document.getElementById('filename').value.trim();
    let yaml = document.getElementById('yaml').value.trim();

    if (!yaml) {
        showAlert("<%:No YAML data to save%>", "danger");
        return;
    }

    fetch('<%=url("admin/tools/toyml_save")%>', {
        method: 'POST',
        body: new URLSearchParams({ filename, yaml })
    })
    .then(res => res.text())
    .then(resp => {
        if (resp === "OK") {
            showAlert("<%:YAML saved successfully%>", "success");
        } else {
            showAlert("<%:Failed to save YAML%>", "danger");
        }
    });
}
</script>
<%+footer%>
