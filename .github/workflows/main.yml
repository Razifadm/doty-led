name: Compile all LuCI apps and release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Platform/Architecture'
        required: true
        default: 'qualcommax/ipq807x'
      firmware_version:
        description: 'Firmware Version'
        required: true
        default: '24.10.0'

  schedule:
    - cron: '0 3 * * *' # Runs every day at 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
        gettext git java-propose-classpath libelf-dev libncurses5-dev \
        libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
        unzip wget rsync subversion swig time xsltproc zlib1g-dev tree zstd

    - name: Set Python symlink
      run: sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Set target variable
      id: set_target
      run: |
        echo "TARGET_DASH=$(echo ${{ github.event.inputs.target }} | sed 's|/|-|g')" >> $GITHUB_OUTPUT

    - name: Download and extract OpenWrt SDK
      run: |
        # Use inputs if set, otherwise use defaults
        FIRMWARE_VERSION="${{ github.event.inputs.firmware_version }}"
        TARGET="${{ github.event.inputs.target }}"

        if [ -z "$FIRMWARE_VERSION" ]; then
          FIRMWARE_VERSION="24.10.0"
        fi
        if [ -z "$TARGET" ]; then
          TARGET="qualcommax/ipq807x"
        fi

        SDK_BASE_URL="https://downloads.openwrt.org/releases/${FIRMWARE_VERSION}/targets/${TARGET}/"
        echo "Using SDK base URL: $SDK_BASE_URL"

        # Convert target to dashed format for SDK file matching
        TARGET_DASH=$(echo "$TARGET" | sed 's|/|-|g')

        SDK_FILE=$(curl -s "$SDK_BASE_URL" | grep -oP "openwrt-sdk-.*?-${TARGET_DASH}_gcc-.*?Linux-x86_64\.tar\.(xz|zst)" | head -n 1)

        if [ -z "$SDK_FILE" ]; then
          echo "Unable to find matching SDK file"
          exit 1
        fi

        SDK_URL="${SDK_BASE_URL}${SDK_FILE}"
        echo "Downloading SDK: $SDK_URL"
        wget "$SDK_URL" -O openwrt.tar.${SDK_FILE##*.}

        mkdir openwrt
        if [[ "$SDK_FILE" == *.zst ]]; then
          tar --use-compress-program=unzstd -xvf openwrt.tar.zst -C openwrt --strip-components=1
        else
          tar -xJf openwrt.tar.xz -C openwrt --strip-components=1
        fi

    - name: Copy all luci-app-* folders into SDK
      run: |
        for dir in luci-app-*; do
          if [ -d "$dir" ]; then
            mkdir -p openwrt/package/$dir
            cp -r $dir/* openwrt/package/$dir/
          fi
        done

    - name: Configure OpenWrt
      working-directory: openwrt
      run: |
        for dir in ../luci-app-*; do
          app=$(basename $dir)
          echo "CONFIG_PACKAGE_${app}=m" >> .config
        done
        make defconfig

    - name: Compile all apps
      working-directory: openwrt
      run: |
        for dir in ../luci-app-*; do
          app=$(basename $dir)
          make package/$app/compile V=s || exit 1
        done

    - name: Organize output IPK files
      run: |
        mkdir -p firmware
        find openwrt/bin/packages/ -type f -name "*.ipk" -exec cp {} firmware/ \;
        ls -lh firmware

    - name: Generate tag with date and time
      id: tag_datetime
      run: echo "TAG_NAME=$(date -u '+%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_datetime.outputs.TAG_NAME }}
        name: LuCI Apps Build – ${{ steps.tag_datetime.outputs.TAG_NAME }}
        body: |
          ✅ Build for target: `${{ github.event.inputs.target || 'qualcommax/ipq807x' }}`
          📦 Firmware version: `${{ github.event.inputs.firmware_version || '24.10.0' }}`
          🚀 Includes all luci-app-* IPKs from the repo.
        files: firmware/*.ipk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

